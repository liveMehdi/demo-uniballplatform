name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and priority tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ball_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ball_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ball_platform_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Prepare test database and Prisma client
        run: npm run test:prepare --prefix server
      - name: Check server and test types
        run: npm run typecheck:tests --prefix server
      - name: Build server
        run: npm run build --prefix server
      - name: Lint client
        run: npm run lint --prefix client
      - name: Backend integration tests
        run: npm test --prefix server
      - name: Install Chromium
        working-directory: server
        run: npx playwright install --with-deps chromium
      - name: Build client and run browser booking journey
        run: npm run test:e2e --prefix server
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-results
          path: |
            server/playwright-report/
            server/test-results/
          if-no-files-found: ignore
          retention-days: 7
